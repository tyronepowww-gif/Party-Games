<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#11132a" />
  <title>Thumb Arena</title>
  <style>
    :root{
      --bg:#101227;
      --bg2:#1c1640;
      --panel:rgba(28,31,61,.92);
      --panel2:rgba(45,49,91,.96);
      --ink:#f7f8ff;
      --muted:#bfc4e9;
      --line:rgba(255,255,255,.12);
      --cyan:#56e4ff;
      --green:#91ff65;
      --yellow:#ffd65a;
      --red:#ff6b88;
      --purple:#ad78ff;
      --orange:#ff9a55;
      --shadow:0 14px 36px rgba(0,0,0,.32);
      --safe-top:max(14px, env(safe-area-inset-top));
      --safe-bottom:max(14px, env(safe-area-inset-bottom));
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      overscroll-behavior:none;
      background:var(--bg);
      color:var(--ink);
      font-family:ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select:none;
      -webkit-user-select:none;
    }

    button,input{
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
    }

    #app{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      background:
        radial-gradient(circle at 12% 10%, rgba(86,228,255,.17), transparent 30%),
        radial-gradient(circle at 88% 24%, rgba(173,120,255,.19), transparent 28%),
        linear-gradient(155deg, var(--bg), var(--bg2));
    }

    #app::before,
    #app::after{
      content:"";
      position:absolute;
      width:180px;
      height:180px;
      border-radius:50%;
      opacity:.2;
      pointer-events:none;
      filter:blur(2px);
      animation:floaty 9s ease-in-out infinite;
    }

    #app::before{
      background:var(--cyan);
      top:-60px;
      left:-74px;
    }

    #app::after{
      background:var(--purple);
      right:-85px;
      bottom:-60px;
      animation-delay:-4s;
    }

    @keyframes floaty{
      50%{transform:translate(14px,18px) scale(1.08)}
    }

    .screen{
      position:absolute;
      inset:0;
      z-index:2;
      overflow-y:auto;
      overflow-x:hidden;
      padding:var(--safe-top) 18px var(--safe-bottom);
      display:none;
    }

    .screen.active{
      display:flex;
      flex-direction:column;
      animation:screenIn .28s ease both;
    }

    @keyframes screenIn{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }

    .center-screen{
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .brand{
      font-size:clamp(2.5rem,13vw,4.4rem);
      letter-spacing:-.08em;
      line-height:.9;
      margin:0;
      text-shadow:0 4px 0 rgba(0,0,0,.18);
    }

    .brand span{
      color:var(--cyan);
    }

    .tagline{
      color:var(--muted);
      margin:13px auto 30px;
      font-size:1rem;
    }

    .boot-console{
      width:min(360px,100%);
      min-height:280px;
      padding:32px 24px;
      border:2px solid rgba(255,255,255,.16);
      border-radius:36px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.03)),
        #565a72;
      box-shadow:inset 0 2px 2px rgba(255,255,255,.2), var(--shadow);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .console-disc{
      width:135px;
      height:135px;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#12142a;
      font-size:2rem;
      background:
        radial-gradient(circle at center, #21243d 0 14%, transparent 15%),
        repeating-conic-gradient(from 0deg, #fe627a 0 30deg, #ffc85c 30deg 60deg, #65e9ff 60deg 90deg, #a58aff 90deg 120deg);
      border:10px solid #25283b;
      box-shadow:0 12px 20px rgba(0,0,0,.32), inset 0 0 0 2px rgba(255,255,255,.45);
      margin-bottom:25px;
      animation:discIdle 5s linear infinite;
    }

    @keyframes discIdle{
      to{transform:rotate(360deg)}
    }

    .btn{
      min-height:54px;
      width:100%;
      padding:13px 17px;
      border-radius:18px;
      font-weight:900;
      letter-spacing:.04em;
      color:#15162d;
      background:var(--cyan);
      box-shadow:0 6px 0 rgba(0,0,0,.22), 0 12px 22px rgba(0,0,0,.2);
      transition:transform .12s ease,filter .12s ease;
    }

    .btn:active{
      transform:translateY(4px);
      box-shadow:0 2px 0 rgba(0,0,0,.22);
      filter:brightness(.92);
    }

    .btn.secondary{
      background:#eceeff;
      color:#242542;
    }

    .btn.dark{
      color:var(--ink);
      background:#34385f;
    }

    .btn.warn{
      background:var(--red);
      color:#2c1020;
    }

    .btn.small{
      width:auto;
      min-height:42px;
      border-radius:14px;
      padding:9px 13px;
      font-size:.78rem;
    }

    .btn-row{
      width:100%;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .btn-row .btn{
      flex:1;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:18px;
    }

    .topbar h2{
      font-size:1.28rem;
      margin:0;
      letter-spacing:-.03em;
    }

    .topbar p{
      margin:3px 0 0;
      color:var(--muted);
      font-size:.82rem;
    }

    .icon-btn{
      width:48px;
      height:48px;
      border-radius:15px;
      background:var(--panel2);
      color:var(--ink);
      font-size:1.2rem;
      border:1px solid var(--line);
    }

    .games-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:13px;
      padding-bottom:18px;
    }

    .game-card{
      min-height:180px;
      padding:14px;
      border-radius:23px;
      background:linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.035)), var(--panel);
      border:1px solid rgba(255,255,255,.13);
      box-shadow:var(--shadow);
      text-align:left;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .game-card:active{
      transform:scale(.98);
    }

    .game-orb{
      width:58px;
      height:58px;
      display:grid;
      place-items:center;
      border-radius:20px;
      font-size:1.7rem;
      color:#16152b;
      box-shadow:inset 0 2px 6px rgba(255,255,255,.4);
    }

    .game-card h3{
      margin:12px 0 5px;
      font-size:1rem;
      line-height:1;
    }

    .game-card p{
      font-size:.75rem;
      line-height:1.24;
      color:var(--muted);
      margin:0;
    }

    .game-card .label{
      display:inline-block;
      font-size:.65rem;
      color:#11142a;
      background:#eef0ff;
      border-radius:999px;
      padding:4px 8px;
      margin-top:11px;
      font-weight:850;
    }

    .selection-wrap{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:17px;
      max-width:440px;
      width:100%;
      margin:auto;
    }

    .disc-stage{
      position:relative;
      min-height:270px;
      border-radius:31px;
      background:linear-gradient(145deg,#5d607a,#353951);
      border:2px solid rgba(255,255,255,.18);
      box-shadow:inset 0 3px 2px rgba(255,255,255,.2),var(--shadow);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .disc-slot{
      width:76%;
      height:35px;
      border-radius:999px;
      background:#161827;
      box-shadow:inset 0 4px 8px rgba(0,0,0,.75), 0 2px 0 rgba(255,255,255,.15);
      position:absolute;
      bottom:48px;
    }

    .chosen-disc{
      width:155px;
      height:155px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:3rem;
      border:11px solid #262a42;
      color:#19182b;
      box-shadow:0 12px 16px rgba(0,0,0,.34),inset 0 0 0 3px rgba(255,255,255,.42);
      animation:insertDisc .65s cubic-bezier(.2,.9,.25,1) both;
    }

    @keyframes insertDisc{
      from{transform:translateY(-180px) rotate(-80deg);opacity:0}
      to{transform:translateY(0) rotate(0);opacity:1}
    }

    .disc-stage h2{
      z-index:1;
      margin:8px 18px 0;
      font-size:1.35rem;
      text-align:center;
    }

    .disc-stage .inserted{
      color:var(--green);
      font-size:.75rem;
      font-weight:900;
      letter-spacing:.14em;
      z-index:1;
      margin-top:9px;
    }

    .setup-card,
    .stats-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:24px;
      padding:18px;
      box-shadow:var(--shadow);
    }

    .setup-card h3,
    .stats-card h3{
      margin:0 0 8px;
      font-size:1.06rem;
    }

    .setup-card p{
      color:var(--muted);
      margin:0 0 16px;
      line-height:1.4;
      font-size:.9rem;
    }

    .player-options{
      display:flex;
      gap:8px;
      margin:11px 0 14px;
    }

    .number-btn{
      min-width:52px;
      height:48px;
      border-radius:15px;
      background:#363a62;
      color:var(--ink);
      font-weight:900;
    }

    .number-btn.active{
      color:#152039;
      background:var(--cyan);
    }

    .player-fields{
      display:grid;
      gap:9px;
      margin:11px 0 15px;
    }

    .player-field{
      height:48px;
      width:100%;
      padding:0 13px;
      color:var(--ink);
      background:#242849;
      border:1px solid var(--line);
      border-radius:14px;
      outline:none;
      user-select:text;
      -webkit-user-select:text;
    }

    .game-screen{
      padding:var(--safe-top) 10px var(--safe-bottom);
      overflow:hidden;
      background:#12152a;
    }

    .game-hud{
      position:relative;
      z-index:10;
      min-height:58px;
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      padding:0 4px 8px;
      align-items:center;
    }

    .hud-main{
      min-width:0;
    }

    .hud-label{
      color:var(--muted);
      font-size:.68rem;
      font-weight:800;
      letter-spacing:.1em;
      text-transform:uppercase;
    }

    .hud-value{
      display:block;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:1.15rem;
      font-weight:950;
    }

    .game-area{
      position:relative;
      width:100%;
      flex:1;
      min-height:0;
      overflow:hidden;
      border-radius:23px;
      touch-action:none;
      background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.12) 0 2px,transparent 3px),
        radial-gradient(circle at 80% 35%,rgba(255,255,255,.08) 0 2px,transparent 3px),
        linear-gradient(155deg,#282c57,#171932);
      border:1px solid rgba(255,255,255,.13);
      box-shadow:inset 0 0 35px rgba(0,0,0,.27);
    }

    .game-canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      touch-action:none;
    }

    .player-dot,
    .hazard,
    .target,
    .avatar,
    .bomb-target{
      position:absolute;
      transform:translate(-50%,-50%);
      touch-action:none;
    }

    .player-dot{
      width:42px;
      height:42px;
      border-radius:50%;
      background:var(--cyan);
      border:4px solid #e7ffff;
      box-shadow:0 0 20px rgba(86,228,255,.75);
      display:grid;
      place-items:center;
      font-size:16px;
    }

    .hazard{
      background:var(--red);
      border:3px solid #ffe9ef;
      border-radius:12px;
      box-shadow:0 0 16px rgba(255,107,136,.6);
    }

    .target{
      width:66px;
      height:66px;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:5px solid rgba(255,255,255,.92);
      background:var(--orange);
      color:#3c1d19;
      font-weight:950;
      font-size:1.1rem;
      box-shadow:0 8px 0 rgba(0,0,0,.18),0 0 20px rgba(255,154,85,.45);
      animation:targetPulse .65s ease-in-out infinite alternate;
    }

    .target.gold{
      background:var(--yellow);
      box-shadow:0 8px 0 rgba(0,0,0,.18),0 0 28px rgba(255,214,90,.8);
    }

    @keyframes targetPulse{
      to{transform:translate(-50%,-50%) scale(.9)}
    }

    .turn-overlay,
    .game-overlay{
      position:absolute;
      inset:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:22px;
      background:rgba(12,13,32,.79);
      backdrop-filter:blur(5px);
    }

    .overlay-card{
      width:min(370px,100%);
      padding:27px 20px;
      border-radius:27px;
      background:linear-gradient(145deg,#373b6a,#22264b);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:var(--shadow);
    }

    .overlay-card h2{
      margin:0 0 8px;
      font-size:1.7rem;
    }

    .overlay-card p{
      color:var(--muted);
      line-height:1.38;
      margin:0 0 20px;
    }

    .countdown{
      font-size:4rem;
      color:var(--cyan);
      font-weight:950;
      margin:8px 0;
    }

    .shake{
      animation:shake .34s ease both;
    }

    @keyframes shake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-10px)}
      40%{transform:translateX(10px)}
      60%{transform:translateX(-7px)}
      80%{transform:translateX(7px)}
    }

    .flash-red{
      animation:flashRed .34s ease both;
    }

    @keyframes flashRed{
      50%{background:#b9284c}
    }

    .hot-player,
    .hot-target{
      position:absolute;
      width:72px;
      height:72px;
      transform:translate(-50%,-50%);
      display:grid;
      place-items:center;
      color:#151529;
      font-size:1.5rem;
      font-weight:950;
      border:5px solid rgba(255,255,255,.88);
      box-shadow:0 6px 0 rgba(0,0,0,.2);
    }

    .hot-player{
      border-radius:50%;
    }

    .hot-target{
      border-radius:20px;
      animation:targetPulse .7s ease-in-out infinite alternate;
    }

    .bomb{
      position:absolute;
      width:30px;
      height:30px;
      border-radius:50%;
      background:#161827;
      border:4px solid #ffd65a;
      right:-6px;
      top:-6px;
      box-shadow:0 0 0 5px rgba(255,214,90,.19),0 0 22px rgba(255,107,136,.9);
      animation:bombPulse .65s infinite alternate;
    }

    @keyframes bombPulse{
      to{transform:scale(1.2);box-shadow:0 0 0 11px rgba(255,107,136,.15),0 0 30px rgba(255,107,136,1)}
    }

    .reflex-board{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      text-align:center;
      touch-action:none;
      padding:20px;
      background:#263059;
    }

    .reflex-board.wait{
      background:#344064;
    }

    .reflex-board.go{
      background:#23c99a;
    }

    .reflex-big{
      font-size:clamp(3rem,16vw,5.2rem);
      font-weight:1000;
      letter-spacing:-.07em;
      line-height:1;
    }

    .reflex-sub{
      margin-top:16px;
      color:rgba(255,255,255,.83);
      font-weight:700;
    }

    .wheel-wrap{
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:15px;
      padding:8px;
    }

    .wheel-box{
      position:relative;
      width:min(84vw,340px);
      aspect-ratio:1;
    }

    #wheelCanvas{
      width:100%;
      height:100%;
      border-radius:50%;
      filter:drop-shadow(0 12px 18px rgba(0,0,0,.3));
    }

    .wheel-pointer{
      position:absolute;
      top:-7px;
      left:50%;
      transform:translateX(-50%);
      width:0;
      height:0;
      border-left:17px solid transparent;
      border-right:17px solid transparent;
      border-top:32px solid #f9fbff;
      filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));
      z-index:2;
    }

    .result-screen{
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    .result-card{
      width:min(430px,100%);
      padding:25px 18px;
      background:linear-gradient(145deg,#393e70,#23274b);
      border:1px solid rgba(255,255,255,.15);
      border-radius:29px;
      box-shadow:var(--shadow);
    }

    .result-icon{
      font-size:3.5rem;
      margin-bottom:5px;
    }

    .result-card h1{
      margin:0;
      font-size:2rem;
      letter-spacing:-.06em;
    }

    .result-card > p{
      color:var(--muted);
      margin:8px 0 17px;
    }

    .ranking{
      text-align:left;
      display:grid;
      gap:8px;
      margin:15px 0 19px;
    }

    .rank-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-height:50px;
      padding:10px 13px;
      background:rgba(255,255,255,.09);
      border-radius:15px;
      font-weight:800;
    }

    .rank-row:first-child{
      background:rgba(255,214,90,.2);
      border:1px solid rgba(255,214,90,.5);
    }

    .rank-row span:last-child{
      color:var(--cyan);
      font-size:.86rem;
      text-align:right;
    }

    .settings-list,
    .stats-list{
      display:grid;
      gap:11px;
    }

    .setting-row,
    .stat-row{
      padding:13px;
      border-radius:16px;
      background:rgba(255,255,255,.07);
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
    }

    .setting-row small,
    .stat-row small{
      display:block;
      color:var(--muted);
      margin-top:3px;
    }

    .switch{
      width:58px;
      height:32px;
      padding:3px;
      border-radius:999px;
      background:#565b81;
      flex:none;
    }

    .switch span{
      display:block;
      width:26px;
      height:26px;
      border-radius:50%;
      background:#f5f6ff;
      transition:transform .18s ease;
    }

    .switch.on{
      background:var(--green);
    }

    .switch.on span{
      transform:translateX(26px);
    }

    .modal{
      position:absolute;
      inset:0;
      z-index:60;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(5,6,18,.7);
      backdrop-filter:blur(5px);
    }

    .modal.show{
      display:flex;
    }

    .modal-card{
      width:min(390px,100%);
      border-radius:25px;
      background:#2b2f58;
      border:1px solid var(--line);
      padding:22px;
      box-shadow:var(--shadow);
    }

    .modal-card h3{
      margin:0 0 8px;
    }

    .modal-card p{
      margin:0 0 19px;
      color:var(--muted);
      line-height:1.42;
    }

    #toast{
      position:absolute;
      z-index:80;
      left:50%;
      bottom:calc(var(--safe-bottom) + 12px);
      max-width:calc(100% - 36px);
      transform:translate(-50%,130px);
      padding:11px 15px;
      border-radius:999px;
      background:#f5f6ff;
      color:#18192e;
      font-size:.84rem;
      font-weight:900;
      opacity:0;
      transition:opacity .2s ease,transform .25s ease;
      pointer-events:none;
      box-shadow:var(--shadow);
      text-align:center;
    }

    #toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    #rotateOverlay{
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:28px;
      background:#11132a;
    }

    #rotateOverlay div{
      max-width:300px;
    }

    #rotateOverlay strong{
      display:block;
      font-size:4rem;
      transform:rotate(90deg);
      margin-bottom:22px;
    }

    #rotateOverlay h2{
      margin:0 0 8px;
    }

    #rotateOverlay p{
      color:var(--muted);
      margin:0;
    }

    @media (orientation:landscape) and (max-height:650px){
      #rotateOverlay{display:flex}
    }

    @media (min-width:650px){
      #app{
        max-width:520px;
        margin:auto;
        box-shadow:0 0 70px rgba(0,0,0,.45);
      }

      body{
        background:#080914;
      }
    }

    @media (prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="rotateOverlay">
    <div>
      <strong>▯</strong>
      <h2>Rotate your device</h2>
      <p>Thumb Arena is designed for portrait play.</p>
    </div>
  </div>

  <script>
    "use strict";

    const GAME_META = {
      dodgeStorm: {
        title: "Dodge Storm",
        icon: "☄",
        accent: "#56e4ff",
        players: "1 Player",
        description: "Drag your hero. Outrun incoming danger."
      },
      trailDuel: {
        title: "Trail Duel",
        icon: "〰",
        accent: "#91ff65",
        players: "2–4 Players",
        description: "Take turns. Leave trails. Do not crash."
      },
      targetRush: {
        title: "Target Rush",
        icon: "◎",
        accent: "#ffb45d",
        players: "1–4 Players",
        description: "Tap fast. Gold targets score big."
      },
      hotCursor: {
        title: "Hot Cursor",
        icon: "●",
        accent: "#ff6b88",
        players: "2–4 Players",
        description: "Pass the bomb before the timer hits zero."
      },
      reflexShot: {
        title: "Reflex Shot",
        icon: "⚡",
        accent: "#62ebc1",
        players: "1–4 Players",
        description: "Wait, then tap at lightning speed."
      },
      survivalWheel: {
        title: "Survival Wheel",
        icon: "◉",
        accent: "#ad78ff",
        players: "Random",
        description: "Spin to choose your next thumb battle."
      }
    };

    const PLAYER_COLORS = ["#56e4ff", "#ff6b88", "#91ff65", "#ffd65a"];

    class StorageManager {
      constructor() {
        this.key = "thumbArenaDataV1";
        this.memoryOnly = false;
        this.data = this.load();
      }

      defaults() {
        return {
          settings: { sound: true, vibration: true },
          stats: {
            gamesPlayed: 0,
            wins: 0,
            longestSurvival: 0,
            targetRushHigh: 0,
            fastestReaction: null,
            reactionTotal: 0,
            reactionCount: 0,
            gameCounts: {
              dodgeStorm: 0,
              trailDuel: 0,
              targetRush: 0,
              hotCursor: 0,
              reflexShot: 0,
              survivalWheel: 0
            }
          }
        };
      }

      load() {
        const fresh = this.defaults();
        try {
          const raw = localStorage.getItem(this.key);
          if (!raw) return fresh;
          const saved = JSON.parse(raw);
          return {
            ...fresh,
            ...saved,
            settings: { ...fresh.settings, ...(saved.settings || {}) },
            stats: {
              ...fresh.stats,
              ...(saved.stats || {}),
              gameCounts: {
                ...fresh.stats.gameCounts,
                ...((saved.stats || {}).gameCounts || {})
              }
            }
          };
        } catch (error) {
          this.memoryOnly = true;
          return fresh;
        }
      }

      save() {
        try {
          localStorage.setItem(this.key, JSON.stringify(this.data));
        } catch (error) {
          this.memoryOnly = true;
        }
      }

      setting(name, value) {
        this.data.settings[name] = value;
        this.save();
      }

      gamePlayed(gameId) {
        this.data.stats.gamesPlayed += 1;
        this.data.stats.gameCounts[gameId] = (this.data.stats.gameCounts[gameId] || 0) + 1;
        this.save();
      }

      addWin() {
        this.data.stats.wins += 1;
        this.save();
      }

      recordDodge(time) {
        this.data.stats.longestSurvival = Math.max(this.data.stats.longestSurvival, time);
        this.save();
      }

      recordTarget(score) {
        this.data.stats.targetRushHigh = Math.max(this.data.stats.targetRushHigh, score);
        this.save();
      }

      recordReaction(ms) {
        const s = this.data.stats;
        s.fastestReaction = s.fastestReaction === null ? ms : Math.min(s.fastestReaction, ms);
        s.reactionTotal += ms;
        s.reactionCount += 1;
        this.save();
      }

      resetStats() {
        const settings = { ...this.data.settings };
        this.data = this.defaults();
        this.data.settings = settings;
        this.save();
      }

      averageReaction() {
        const s = this.data.stats;
        return s.reactionCount ? Math.round(s.reactionTotal / s.reactionCount) : null;
      }
    }

    class UIManager {
      constructor(app, storage, manager) {
        this.app = app;
        this.storage = storage;
        this.manager = manager;
        this.modalAction = null;
      }

      render(content, className = "") {
        this.app.innerHTML = `
          <main class="screen active ${className}">
            ${content}
          </main>
          <div id="modal" class="modal"></div>
          <div id="toast"></div>
        `;
      }

      bind(selector, handler) {
        const element = this.app.querySelector(selector);
        if (element) element.addEventListener("click", handler);
        return element;
      }

      toast(message) {
        const toast = this.app.querySelector("#toast");
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => toast.classList.remove("show"), 1750);
      }

      showModal(title, text, confirmLabel, action, warning = false) {
        const modal = this.app.querySelector("#modal");
        if (!modal) return;
        this.modalAction = action;
        modal.innerHTML = `
          <div class="modal-card">
            <h3>${title}</h3>
            <p>${text}</p>
            <div class="btn-row">
              <button class="btn secondary" id="modalCancel">Cancel</button>
              <button class="btn ${warning ? "warn" : ""}" id="modalConfirm">${confirmLabel}</button>
            </div>
          </div>
        `;
        modal.classList.add("show");
        modal.querySelector("#modalCancel").onclick = () => modal.classList.remove("show");
        modal.querySelector("#modalConfirm").onclick = () => {
          modal.classList.remove("show");
          if (typeof this.modalAction === "function") this.modalAction();
        };
      }

      home() {
        this.render(`
          <section class="center-screen" style="min-height:100%">
            <div class="boot-console">
              <div class="console-disc">◉</div>
              <h1 class="brand">THUMB <span>ARENA</span></h1>
              <p class="tagline">Tiny games. Big thumb battles.</p>
              <button id="enterBtn" class="btn">ENTER</button>
              <p style="margin:15px 0 0;color:#e9ebff;font-size:.76rem;font-weight:800;">TAP TO POWER ON • OFFLINE PLAY</p>
            </div>
          </section>
        `, "center-screen");
        this.bind("#enterBtn", () => {
          this.manager.sound("start");
          this.manager.showGames();
        });
      }

      games() {
        const cards = Object.entries(GAME_META).map(([id, game]) => `
          <button class="game-card" data-game="${id}" aria-label="Select ${game.title}">
            <div>
              <div class="game-orb" style="background:${game.accent}">${game.icon}</div>
              <h3>${game.title}</h3>
              <p>${game.description}</p>
            </div>
            <span class="label">${game.players}</span>
          </button>
        `).join("");

        this.render(`
          <div class="topbar">
            <div>
              <h2>Game Discs</h2>
              <p>Select a disc to insert.</p>
            </div>
            <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
          </div>
          <section class="games-grid">${cards}</section>
          <button id="powerBtn" class="btn dark">⏻ POWER OFF</button>
        `);

        this.app.querySelectorAll("[data-game]").forEach(card => {
          card.addEventListener("click", () => this.manager.selectDisc(card.dataset.game));
        });

        this.bind("#settingsBtn", () => this.settings());
        this.bind("#powerBtn", () => {
          this.manager.sound("click");
          this.manager.goHome();
        });
      }

      discSelected(gameId) {
        const game = GAME_META[gameId];
        this.render(`
          <div class="topbar">
            <button id="backGames" class="icon-btn" aria-label="Back">←</button>
            <div style="text-align:right">
              <h2 style="margin:0">${game.title}</h2>
              <p>Disc ready</p>
            </div>
          </div>

          <section class="selection-wrap">
            <div class="disc-stage">
              <div class="chosen-disc" style="background:${game.accent}">${game.icon}</div>
              <h2>${game.title}</h2>
              <div class="inserted">DISC INSERTED</div>
              <div class="disc-slot"></div>
            </div>
            <button id="startSetup" class="btn">START GAME</button>
            <button id="backGames2" class="btn secondary">BACK TO GAMES</button>
          </section>
        `);

        this.bind("#backGames", () => this.manager.showGames());
        this.bind("#backGames2", () => this.manager.showGames());
        this.bind("#startSetup", () => this.manager.showSetup(gameId));
      }

      setup(gameId) {
        const game = GAME_META[gameId];
        const multiplayer = ["trailDuel", "targetRush", "hotCursor", "reflexShot"].includes(gameId);
        const soloOnly = gameId === "dodgeStorm";
        const wheel = gameId === "survivalWheel";

        if (wheel) {
          this.render(`
            <div class="topbar">
              <button id="setupBack" class="icon-btn">←</button>
              <div style="text-align:right"><h2>Survival Wheel</h2><p>Random game selector</p></div>
            </div>
            <section class="selection-wrap">
              <div class="setup-card">
                <h3>Ready to spin?</h3>
                <p>Spin the wheel and it will choose one of the other games. Multiplayer games will ask for players after the wheel lands.</p>
                <button id="launchWheel" class="btn">OPEN WHEEL</button>
              </div>
            </section>
          `);
          this.bind("#setupBack", () => this.manager.selectDisc(gameId));
          this.bind("#launchWheel", () => this.manager.startGame(gameId, { players: ["Player 1"] }));
          return;
        }

        const initialPlayers = soloOnly ? 1 : 2;
        this.render(`
          <div class="topbar">
            <button id="setupBack" class="icon-btn" aria-label="Back">←</button>
            <div style="text-align:right">
              <h2>${game.title}</h2>
              <p>Game start menu</p>
            </div>
          </div>

          <section class="setup-card">
            <h3>How to play</h3>
            <p>${this.instructions(gameId)}</p>
            ${multiplayer ? `
              <h3>Players</h3>
              <div id="playerOptions" class="player-options">
                <button class="number-btn active" data-count="2">2</button>
                <button class="number-btn" data-count="3">3</button>
                <button class="number-btn" data-count="4">4</button>
              </div>
              <div id="playerFields" class="player-fields"></div>
            ` : `
              <div class="setting-row">
                <div><strong>Solo mode</strong><small>One thumb. One arena.</small></div>
                <strong>1 PLAYER</strong>
              </div>
            `}
            <div style="height:14px"></div>
            <button id="launchGame" class="btn">START</button>
          </section>
        `);

        this.bind("#setupBack", () => this.manager.selectDisc(gameId));

        let count = initialPlayers;
        const fields = this.app.querySelector("#playerFields");

        const drawFields = () => {
          if (!fields) return;
          fields.innerHTML = Array.from({ length: count }, (_, index) => `
            <input class="player-field" maxlength="14" value="Player ${index + 1}" aria-label="Player ${index + 1} name">
          `).join("");
        };

        if (multiplayer) {
          drawFields();
          this.app.querySelectorAll("[data-count]").forEach(button => {
            button.addEventListener("click", () => {
              count = Number(button.dataset.count);
              this.app.querySelectorAll("[data-count]").forEach(b => b.classList.toggle("active", b === button));
              drawFields();
              this.manager.sound("click");
            });
          });
        }

        this.bind("#launchGame", () => {
          const players = multiplayer
            ? [...this.app.querySelectorAll(".player-field")].map((field, i) => field.value.trim() || `Player ${i + 1}`)
            : ["Player 1"];
          this.manager.startGame(gameId, { players });
        });
      }

      instructions(gameId) {
        const map = {
          dodgeStorm: "Touch and drag your bright circle. Avoid hazards entering from every edge. Survive as long as possible.",
          trailDuel: "Players take turns. Drag to move and leave a trail. Touch any trail and you are eliminated. The arena wraps at its edges.",
          targetRush: "Each player gets 30 seconds. Tap targets for points. Gold targets are worth three points.",
          hotCursor: "The bomb holder drags into the square target to pass it. The countdown continues between handoffs. Do not hold it at zero.",
          reflexShot: "Wait for TAP! Then tap the screen as quickly as possible. Tapping during WAIT is a false start."
        };
        return map[gameId] || "";
      }

      gameShell(title, hudLabel, hudValue) {
        this.render(`
          <div class="game-hud">
            <div class="hud-main">
              <span class="hud-label">${hudLabel}</span>
              <span id="hudValue" class="hud-value">${hudValue}</span>
            </div>
            <button id="exitGame" class="icon-btn" aria-label="Exit game">✕</button>
          </div>
          <section id="gameArea" class="game-area"></section>
        `, "game-screen");

        this.bind("#exitGame", () => {
          this.showModal("Exit this game?", "Your current round will not be saved as a win.", "Exit", () => this.manager.showGames(), true);
        });
        return this.app.querySelector("#gameArea");
      }

      results(title, subtitle, rankings, gameId) {
        const rows = rankings.map((item, index) => `
          <div class="rank-row">
            <strong>${index + 1}. ${item.name}</strong>
            <span>${item.score}</span>
          </div>
        `).join("");

        this.render(`
          <section class="result-screen" style="min-height:100%">
            <div class="result-card">
              <div class="result-icon">${rankings.length > 1 ? "🏆" : "⭐"}</div>
              <h1>${title}</h1>
              <p>${subtitle}</p>
              <div class="ranking">${rows}</div>
              <button id="replayBtn" class="btn">PLAY AGAIN</button>
              <div style="height:10px"></div>
              <button id="chooseBtn" class="btn secondary">CHOOSE ANOTHER DISC</button>
              <div style="height:10px"></div>
              <button id="consoleBtn" class="btn dark">RETURN TO CONSOLE</button>
            </div>
          </section>
        `, "result-screen");

        this.bind("#replayBtn", () => this.manager.showSetup(gameId));
        this.bind("#chooseBtn", () => this.manager.showGames());
        this.bind("#consoleBtn", () => this.manager.goHome());
      }

      stats() {
        const s = this.storage.data.stats;
        const reactionAverage = this.storage.averageReaction();

        this.render(`
          <div class="topbar">
            <button id="statsBack" class="icon-btn">←</button>
            <div style="text-align:right"><h2>Statistics</h2><p>Saved on this device</p></div>
          </div>

          <section class="stats-card">
            <div class="stats-list">
              <div class="stat-row"><div><strong>Games played</strong><small>All Thumb Arena rounds</small></div><strong>${s.gamesPlayed}</strong></div>
              <div class="stat-row"><div><strong>Total wins</strong><small>Local winners recorded</small></div><strong>${s.wins}</strong></div>
              <div class="stat-row"><div><strong>Longest survival</strong><small>Dodge Storm</small></div><strong>${s.longestSurvival.toFixed(1)}s</strong></div>
              <div class="stat-row"><div><strong>Target Rush high score</strong><small>Best tap score</small></div><strong>${s.targetRushHigh}</strong></div>
              <div class="stat-row"><div><strong>Fastest reaction</strong><small>Reflex Shot</small></div><strong>${s.fastestReaction === null ? "—" : `${s.fastestReaction} ms`}</strong></div>
              <div class="stat-row"><div><strong>Average reaction</strong><small>All valid Reflex Shot attempts</small></div><strong>${reactionAverage === null ? "—" : `${reactionAverage} ms`}</strong></div>
            </div>
            <div style="height:15px"></div>
            <button id="clearStats" class="btn warn">RESET STATISTICS</button>
          </section>
        `);

        this.bind("#statsBack", () => this.settings());
        this.bind("#clearStats", () => {
          this.showModal("Reset statistics?", "This clears all saved games, wins, high scores, and reaction records on this device.", "Reset", () => {
            this.storage.resetStats();
            this.toast("Statistics reset");
            this.stats();
          }, true);
        });
      }

      settings() {
        const settings = this.storage.data.settings;
        this.render(`
          <div class="topbar">
            <button id="settingsBack" class="icon-btn">←</button>
            <div style="text-align:right"><h2>Settings</h2><p>Local device preferences</p></div>
          </div>

          <section class="stats-card">
            <div class="settings-list">
              <div class="setting-row">
                <div><strong>Sound</strong><small>Simple generated arcade beeps</small></div>
                <button id="soundSwitch" class="switch ${settings.sound ? "on" : ""}" aria-label="Toggle sound"><span></span></button>
              </div>
              <div class="setting-row">
                <div><strong>Vibration</strong><small>Only on compatible devices</small></div>
                <button id="vibrationSwitch" class="switch ${settings.vibration ? "on" : ""}" aria-label="Toggle vibration"><span></span></button>
              </div>
              <div class="setting-row">
                <div><strong>Offline mode</strong><small>No accounts, servers, or internet required</small></div>
                <strong>ON</strong>
              </div>
            </div>
            <div style="height:15px"></div>
            <button id="openStats" class="btn secondary">VIEW STATISTICS</button>
          </section>
        `);

        this.bind("#settingsBack", () => this.manager.showGames());
        this.bind("#openStats", () => this.stats());

        this.bind("#soundSwitch", () => {
          this.storage.setting("sound", !this.storage.data.settings.sound);
          this.manager.sound("click");
          this.settings();
        });

        this.bind("#vibrationSwitch", () => {
          this.storage.setting("vibration", !this.storage.data.settings.vibration);
          this.manager.vibrate(18);
          this.settings();
        });
      }
    }

    class GameManager {
      constructor() {
        this.app = document.querySelector("#app");
        this.storage = new StorageManager();
        this.ui = new UIManager(this.app, this.storage, this);
        this.activeGame = null;
        this.selectedGame = null;
        this.audioContext = null;
        this.ui.home();
        document.addEventListener("contextmenu", event => event.preventDefault());
        document.addEventListener("gesturestart", event => event.preventDefault(), { passive: false });
      }

      sound(type = "click") {
        if (!this.storage.data.settings.sound) return;
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!this.audioContext) this.audioContext = new AudioContextClass();
          if (this.audioContext.state === "suspended") this.audioContext.resume();
          const ctx = this.audioContext;
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          const map = {
            click: [480, .055],
            start: [680, .11],
            hit: [130, .17],
            win: [880, .16],
            target: [760, .055],
            gold: [1040, .09]
          };
          const [frequency, duration] = map[type] || map.click;
          oscillator.type = type === "hit" ? "sawtooth" : "sine";
          oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);
          gain.gain.setValueAtTime(.07, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration);
          oscillator.connect(gain).connect(ctx.destination);
          oscillator.start();
          oscillator.stop(ctx.currentTime + duration);
        } catch (error) {}
      }

      vibrate(pattern = 18) {
        if (!this.storage.data.settings.vibration) return;
        if ("vibrate" in navigator) {
          try { navigator.vibrate(pattern); } catch (error) {}
        }
      }

      stopActive() {
        if (this.activeGame) {
          this.activeGame.cleanup();
          this.activeGame = null;
        }
      }

      goHome() {
        this.stopActive();
        this.selectedGame = null;
        this.ui.home();
      }

      showGames() {
        this.stopActive();
        this.ui.games();
      }

      selectDisc(gameId) {
        this.stopActive();
        this.selectedGame = gameId;
        this.sound("click");
        this.ui.discSelected(gameId);
      }

      showSetup(gameId) {
        this.stopActive();
        this.selectedGame = gameId;
        this.sound("click");
        this.ui.setup(gameId);
      }

      startGame(gameId, config) {
        this.stopActive();
        this.storage.gamePlayed(gameId);
        this.sound("start");

        const classes = {
          dodgeStorm: DodgeStormGame,
          trailDuel: TrailDuelGame,
          targetRush: TargetRushGame,
          hotCursor: HotCursorGame,
          reflexShot: ReflexShotGame,
          survivalWheel: SurvivalWheelGame
        };

        this.activeGame = new classes[gameId](this, config);
        this.activeGame.start();
      }

      completeGame(gameId, rankings, title = "RESULTS", subtitle = "Round complete.") {
        this.stopActive();
        if (rankings.length) {
          this.storage.addWin();
        }
        this.sound("win");
        this.vibrate([25, 35, 50]);
        this.ui.results(title, subtitle, rankings, gameId);
      }
    }

    class BaseGame {
      constructor(manager, config = {}) {
        this.manager = manager;
        this.ui = manager.ui;
        this.storage = manager.storage;
        this.config = config;
        this.players = config.players || ["Player 1"];
        this.area = null;
        this.frame = null;
        this.timeouts = [];
        this.intervals = [];
        this.listeners = [];
        this.running = false;
      }

      start() {}

      later(callback, ms) {
        const id = setTimeout(callback, ms);
        this.timeouts.push(id);
        return id;
      }

      every(callback, ms) {
        const id = setInterval(callback, ms);
        this.intervals.push(id);
        return id;
      }

      listen(element, type, handler, options) {
        element.addEventListener(type, handler, options);
        this.listeners.push([element, type, handler, options]);
      }

      rect() {
        return this.area.getBoundingClientRect();
      }

      setHUD(text) {
        const hud = document.querySelector("#hudValue");
        if (hud) hud.textContent = text;
      }

      overlay(html) {
        const overlay = document.createElement("div");
        overlay.className = "turn-overlay";
        overlay.innerHTML = html;
        this.area.appendChild(overlay);
        return overlay;
      }

      cleanup() {
        this.running = false;
        if (this.frame) cancelAnimationFrame(this.frame);
        this.timeouts.forEach(clearTimeout);
        this.intervals.forEach(clearInterval);
        this.listeners.forEach(([el, type, handler, options]) => el.removeEventListener(type, handler, options));
        this.timeouts = [];
        this.intervals = [];
        this.listeners = [];
      }

      pointFromEvent(event) {
        const rect = this.rect();
        return {
          x: Math.max(0, Math.min(rect.width, event.clientX - rect.left)),
          y: Math.max(0, Math.min(rect.height, event.clientY - rect.top))
        };
      }
    }

    class DodgeStormGame extends BaseGame {
      start() {
        this.area = this.ui.gameShell("Dodge Storm", "Survival", "0.0s • Level 1");
        this.player = { x: 0, y: 0, radius: 21, tx: 0, ty: 0 };
        this.hazards = [];
        this.startedAt = 0;
        this.lastSpawn = 0;
        this.pointerDown = false;
        this.playerEl = document.createElement("div");
        this.playerEl.className = "player-dot";
        this.playerEl.textContent = "•ᴗ•";
        this.area.appendChild(this.playerEl);

        this.showCountdown();
      }

      showCountdown() {
        const overlay = this.overlay(`
          <div class="overlay-card">
            <div class="hud-label">Dodge Storm</div>
            <div id="countValue" class="countdown">3</div>
            <p>Touch and drag your circle. Avoid every hazard.</p>
          </div>
        `);

        let count = 3;
        const tick = () => {
          const countValue = overlay.querySelector("#countValue");
          if (count <= 0) {
            countValue.textContent = "GO!";
            this.manager.sound("start");
            this.later(() => {
              overlay.remove();
              this.begin();
            }, 500);
            return;
          }
          countValue.textContent = count;
          this.manager.sound("click");
          count--;
          this.later(tick, 720);
        };
        tick();
      }

      begin() {
        const r = this.rect();
        this.player.x = this.player.tx = r.width / 2;
        this.player.y = this.player.ty = r.height / 2;
        this.positionPlayer();
        this.running = true;
        this.startedAt = performance.now();

        this.listen(this.area, "pointerdown", event => {
          this.pointerDown = true;
          this.area.setPointerCapture?.(event.pointerId);
          const p = this.pointFromEvent(event);
          this.player.tx = p.x;
          this.player.ty = p.y;
        });

        this.listen(this.area, "pointermove", event => {
          if (!this.pointerDown) return;
          const p = this.pointFromEvent(event);
          this.player.tx = p.x;
          this.player.ty = p.y;
        });

        this.listen(this.area, "pointerup", () => this.pointerDown = false);
        this.listen(this.area, "pointercancel", () => this.pointerDown = false);

        const loop = now => {
          if (!this.running) return;
          const elapsed = (now - this.startedAt) / 1000;
          const level = Math.floor(elapsed / 10) + 1;
          this.player.x += (this.player.tx - this.player.x) * .18;
          this.player.y += (this.player.ty - this.player.y) * .18;
          this.positionPlayer();

          const spawnDelay = Math.max(250, 850 - (level - 1) * 95);
          if (now - this.lastSpawn > spawnDelay) {
            this.spawnHazard(level);
            this.lastSpawn = now;
          }

          this.updateHazards(level);
          this.setHUD(`${elapsed.toFixed(1)}s • Level ${level}`);
          this.frame = requestAnimationFrame(loop);
        };
        this.frame = requestAnimationFrame(loop);
      }

      positionPlayer() {
        this.playerEl.style.left = `${this.player.x}px`;
        this.playerEl.style.top = `${this.player.y}px`;
      }

      spawnHazard(level) {
        const r = this.rect();
        const side = Math.floor(Math.random() * 4);
        const size = 22 + Math.random() * Math.min(20, level * 3);
        let x, y;

        if (side === 0) { x = -size; y = Math.random() * r.height; }
        if (side === 1) { x = r.width + size; y = Math.random() * r.height; }
        if (side === 2) { x = Math.random() * r.width; y = -size; }
        if (side === 3) { x = Math.random() * r.width; y = r.height + size; }

        const angle = Math.atan2(this.player.y - y, this.player.x - x) + (Math.random() - .5) * .6;
        const speed = 1.25 + level * .22 + Math.random() * .6;
        const el = document.createElement("div");
        el.className = "hazard";
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.transform = `translate(-50%,-50%) rotate(${Math.random() * 90}deg)`;
        this.area.appendChild(el);

        this.hazards.push({
          x, y, size, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, el
        });
      }

      updateHazards() {
        const r = this.rect();
        for (let i = this.hazards.length - 1; i >= 0; i--) {
          const h = this.hazards[i];
          h.x += h.vx;
          h.y += h.vy;
          h.el.style.left = `${h.x}px`;
          h.el.style.top = `${h.y}px`;

          const dx = h.x - this.player.x;
          const dy = h.y - this.player.y;
          if (Math.hypot(dx, dy) < this.player.radius + h.size * .48) {
            this.end();
            return;
          }

          if (h.x < -120 || h.y < -120 || h.x > r.width + 120 || h.y > r.height + 120) {
            h.el.remove();
            this.hazards.splice(i, 1);
          }
        }
      }

      end() {
        if (!this.running) return;
        this.running = false;
        const survival = (performance.now() - this.startedAt) / 1000;
        this.storage.recordDodge(survival);
        this.manager.sound("hit");
        this.manager.vibrate([40, 25, 70]);
        this.area.classList.add("shake", "flash-red");
        this.later(() => {
          this.manager.completeGame(
            "dodgeStorm",
            [{ name: "Player 1", score: `${survival.toFixed(1)} seconds` }],
            "STORM GOT YOU",
            `You survived ${survival.toFixed(1)} seconds. Best: ${this.storage.data.stats.longestSurvival.toFixed(1)} seconds.`
          );
        }, 500);
      }
    }

    class TrailDuelGame extends BaseGame {
      start() {
        this.area = this.ui.gameShell("Trail Duel", "Arena", "Preparing players…");
        this.canvas = document.createElement("canvas");
        this.canvas.className = "game-canvas";
        this.area.appendChild(this.canvas);
        this.ctx = this.canvas.getContext("2d");
        this.alive = this.players.map((name, index) => ({
          name,
          color: PLAYER_COLORS[index],
          alive: true,
          eliminatedAt: 0
        }));
        this.currentIndex = 0;
        this.turnDuration = 3200;
        this.trails = [];
        this.turnPoints = [];
        this.resizeCanvas();
        this.listen(window, "resize", () => this.resizeCanvas());
        this.nextTurn();
      }

      resizeCanvas() {
        const r = this.rect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.canvas.width = r.width * dpr;
        this.canvas.height = r.height * dpr;
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.draw();
      }

      getNextAlive(start) {
        for (let offset = 0; offset < this.alive.length; offset++) {
          const i = (start + offset) % this.alive.length;
          if (this.alive[i].alive) return i;
        }
        return -1;
      }

      nextTurn() {
        const remaining = this.alive.filter(p => p.alive);
        if (remaining.length <= 1) {
          this.finish();
          return;
        }

        this.currentIndex = this.getNextAlive(this.currentIndex);
        this.current = this.alive[this.currentIndex];
        const overlay = this.overlay(`
          <div class="overlay-card">
            <div class="hud-label">Trail Duel</div>
            <h2 style="color:${this.current.color}">PASS TO ${this.current.name.toUpperCase()}</h2>
            <p>Drag continuously. Touch any trail and you are out. Arena edges wrap around.</p>
            <button id="readyTurn" class="btn">TAP WHEN READY</button>
          </div>
        `);

        overlay.querySelector("#readyTurn").onclick = () => {
          overlay.remove();
          this.runTurn();
        };
      }

      runTurn() {
        const r = this.rect();
        const startPositions = [
          [r.width * .2, r.height * .2],
          [r.width * .8, r.height * .2],
          [r.width * .8, r.height * .8],
          [r.width * .2, r.height * .8]
        ];
        const pos = startPositions[this.currentIndex % startPositions.length];
        this.point = { x: pos[0], y: pos[1] };
        this.lastPoint = { ...this.point };
        this.turnPoints = [{ ...this.point }];
        this.dragging = false;
        this.turnEnded = false;
        const turnStarted = performance.now();

        this.setHUD(`${this.current.name} • ${this.turnDuration / 1000}s • ${this.alive.filter(p => p.alive).length} alive`);

        const onDown = event => {
          this.dragging = true;
          this.area.setPointerCapture?.(event.pointerId);
          const p = this.pointFromEvent(event);
          this.moveTo(p.x, p.y);
        };

        const onMove = event => {
          if (!this.dragging || this.turnEnded) return;
          const p = this.pointFromEvent(event);
          this.moveTo(p.x, p.y);
        };

        const onUp = () => this.dragging = false;
        this.listen(this.area, "pointerdown", onDown);
        this.listen(this.area, "pointermove", onMove);
        this.listen(this.area, "pointerup", onUp);
        this.listen(this.area, "pointercancel", onUp);

        const tick = now => {
          if (this.turnEnded) return;
          const left = Math.max(0, this.turnDuration - (now - turnStarted));
          this.setHUD(`${this.current.name} • ${(left / 1000).toFixed(1)}s • ${this.alive.filter(p => p.alive).length} alive`);
          if (left <= 0) {
            this.endTurn(false);
            return;
          }
          this.frame = requestAnimationFrame(tick);
        };
        this.frame = requestAnimationFrame(tick);
      }

      moveTo(x, y) {
        const r = this.rect();
        x = ((x % r.width) + r.width) % r.width;
        y = ((y % r.height) + r.height) % r.height;

        const dx = x - this.lastPoint.x;
        const dy = y - this.lastPoint.y;
        if (Math.abs(dx) > r.width * .5 || Math.abs(dy) > r.height * .5) {
          this.lastPoint = { x, y };
          this.turnPoints.push({ x, y });
          this.draw();
          return;
        }

        const distance = Math.hypot(dx, dy);
        if (distance < 4) return;

        const steps = Math.ceil(distance / 5);
        for (let i = 1; i <= steps; i++) {
          const px = this.lastPoint.x + dx * (i / steps);
          const py = this.lastPoint.y + dy * (i / steps);
          if (this.hitTrail(px, py)) {
            this.point = { x: px, y: py };
            this.endTurn(true);
            return;
          }
          this.turnPoints.push({ x: px, y: py });
        }

        this.lastPoint = { x, y };
        this.point = { x, y };
        this.draw();
      }

      hitTrail(x, y) {
        for (const trail of this.trails) {
          for (const point of trail.points) {
            if (Math.hypot(point.x - x, point.y - y) < 11) return true;
          }
        }
        for (const point of this.turnPoints) {
          if (Math.hypot(point.x - x, point.y - y) < 10 && Math.hypot(point.x - this.lastPoint.x, point.y - this.lastPoint.y) > 14) return true;
        }
        return false;
      }

      endTurn(eliminated) {
        if (this.turnEnded) return;
        this.turnEnded = true;
        if (this.frame) cancelAnimationFrame(this.frame);

        this.trails.push({ color: this.current.color, points: [...this.turnPoints] });
        if (eliminated) {
          this.current.alive = false;
          this.current.eliminatedAt = Date.now();
          this.manager.sound("hit");
          this.manager.vibrate(50);
          this.ui.toast(`${this.current.name} crashed!`);
        } else {
          this.manager.sound("click");
        }

        this.draw();
        this.currentIndex = (this.currentIndex + 1) % this.alive.length;
        this.later(() => this.nextTurn(), 700);
      }

      draw() {
        if (!this.ctx || !this.canvas) return;
        const r = this.rect();
        this.ctx.clearRect(0, 0, r.width, r.height);

        for (const trail of this.trails) {
          if (trail.points.length < 2) continue;
          this.ctx.strokeStyle = trail.color;
          this.ctx.lineWidth = 10;
          this.ctx.lineCap = "round";
          this.ctx.lineJoin = "round";
          this.ctx.beginPath();
          this.ctx.moveTo(trail.points[0].x, trail.points[0].y);
          for (let i = 1; i < trail.points.length; i++) {
            const p = trail.points[i];
            const prev = trail.points[i - 1];
            if (Math.abs(p.x - prev.x) > r.width * .5 || Math.abs(p.y - prev.y) > r.height * .5) {
              this.ctx.moveTo(p.x, p.y);
            } else {
              this.ctx.lineTo(p.x, p.y);
            }
          }
          this.ctx.stroke();
        }

        if (this.point && this.current) {
          this.ctx.beginPath();
          this.ctx.fillStyle = this.current.color;
          this.ctx.arc(this.point.x, this.point.y, 13, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.lineWidth = 3;
          this.ctx.strokeStyle = "#fff";
          this.ctx.stroke();
        }
      }

      finish() {
        const alive = this.alive.filter(p => p.alive);
        const losers = this.alive.filter(p => !p.alive).reverse();
        const ordered = [...alive, ...losers];
        const rankings = ordered.map((p, index) => ({
          name: p.name,
          score: index === 0 ? "Last rider standing" : "Eliminated"
        }));
        this.manager.completeGame("trailDuel", rankings, "TRAIL DUEL RESULTS", `${alive[0]?.name || "No one"} owns the arena.`);
      }
    }

    class TargetRushGame extends BaseGame {
      start() {
        this.area = this.ui.gameShell("Target Rush", "Target Rush", "Get ready…");
        this.scores = this.players.map(name => ({ name, score: 0 }));
        this.playerIndex = 0;
        this.roundLength = 30000;
        this.playNextPlayer();
      }

      playNextPlayer() {
        if (this.playerIndex >= this.players.length) {
          this.finish();
          return;
        }

        const player = this.players[this.playerIndex];
        const overlay = this.overlay(`
          <div class="overlay-card">
            <div class="hud-label">Target Rush</div>
            <h2>PASS TO ${player.toUpperCase()}</h2>
            <p>Tap targets for 30 seconds. Orange = 1 point. Gold = 3 points.</p>
            <button id="targetReady" class="btn">TAP WHEN READY</button>
          </div>
        `);

        overlay.querySelector("#targetReady").onclick = () => {
          overlay.remove();
          this.runRound();
        };
      }

      runRound() {
        this.running = true;
        this.currentScore = 0;
        this.activeTargets = [];
        this.roundStart = performance.now();
        this.lastSpawn = 0;

        const loop = now => {
          if (!this.running) return;
          const elapsed = now - this.roundStart;
          const left = Math.max(0, this.roundLength - elapsed);
          this.setHUD(`${this.players[this.playerIndex]} • ${Math.ceil(left / 1000)}s • ${this.currentScore} pts`);

          const interval = Math.max(360, 770 - elapsed / 85);
          if (now - this.lastSpawn > interval && this.activeTargets.length < 3) {
            this.spawnTarget();
            this.lastSpawn = now;
          }

          for (let i = this.activeTargets.length - 1; i >= 0; i--) {
            const target = this.activeTargets[i];
            const life = (now - target.created) / target.life;
            target.el.style.opacity = `${Math.max(.15, 1 - life)}`;
            if (life > .65) target.el.style.transform = `translate(-50%,-50%) scale(${Math.max(.45, 1 - life * .6)})`;
            if (life >= 1) {
              target.el.remove();
              this.activeTargets.splice(i, 1);
            }
          }

          if (left <= 0) {
            this.running = false;
            this.scores[this.playerIndex].score = this.currentScore;
            this.manager.sound("win");
            this.playerIndex++;
            this.later(() => this.playNextPlayer(), 700);
            return;
          }

          this.frame = requestAnimationFrame(loop);
        };
        this.frame = requestAnimationFrame(loop);
      }

      spawnTarget() {
        const r = this.rect();
        const gold = Math.random() < .17;
        const size = 62;
        const x = 45 + Math.random() * Math.max(1, r.width - 90);
        const y = 50 + Math.random() * Math.max(1, r.height - 100);
        const target = document.createElement("button");
        target.className = `target ${gold ? "gold" : ""}`;
        target.textContent = gold ? "★" : "+1";
        target.style.left = `${x}px`;
        target.style.top = `${y}px`;

        const data = {
          el: target,
          gold,
          created: performance.now(),
          life: gold ? 950 : 1250
        };

        target.addEventListener("pointerdown", event => {
          event.preventDefault();
          if (!this.running || !this.activeTargets.includes(data)) return;
          const points = gold ? 3 : 1;
          this.currentScore += points;
          this.storage.recordTarget(this.currentScore);
          this.manager.sound(gold ? "gold" : "target");
          this.manager.vibrate(gold ? 25 : 10);
          const pop = document.createElement("div");
          pop.textContent = `+${points}`;
          pop.style.cssText = `position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);font-size:1.45rem;font-weight:1000;color:${gold ? "#ffe27e" : "#fff"};pointer-events:none;z-index:7;transition:all .45s ease`;
          this.area.appendChild(pop);
          requestAnimationFrame(() => {
            pop.style.top = `${y - 38}px`;
            pop.style.opacity = "0";
          });
          this.later(() => pop.remove(), 500);
          target.remove();
          this.activeTargets.splice(this.activeTargets.indexOf(data), 1);
        });

        this.area.appendChild(target);
        this.activeTargets.push(data);
      }

      finish() {
        const rankings = [...this.scores]
          .sort((a, b) => b.score - a.score)
          .map(item => ({ name: item.name, score: `${item.score} points` }));
        this.manager.completeGame(
          "targetRush",
          rankings,
          "TARGET RUSH RESULTS",
          `High score on this device: ${this.storage.data.stats.targetRushHigh} points.`
        );
      }
    }

    class HotCursorGame extends BaseGame {
      start() {
        this.area = this.ui.gameShell("Hot Cursor", "Hot Bomb", "Preparing…");
        this.active = this.players.map((name, index) => ({
          name,
          color: PLAYER_COLORS[index],
          alive: true
        }));
        this.holderIndex = Math.floor(Math.random() * this.active.length);
        this.targetIndex = null;
        this.bombDuration = 23000;
        this.beginBombRound();
      }

      beginBombRound() {
        if (this.active.filter(p => p.alive).length <= 1) {
          this.finish();
          return;
        }
        this.bombStart = performance.now();
        this.showPassOverlay();
      }

      showPassOverlay() {
        const holder = this.active[this.holderIndex];
        const overlay = this.overlay(`
          <div class="overlay-card">
            <div class="hud-label">Hot Cursor</div>
            <h2 style="color:${holder.color}">PASS TO ${holder.name.toUpperCase()}</h2>
            <p>Drag your circle into the square target to pass the bomb. Do not be holding it when time reaches zero.</p>
            <button id="bombReady" class="btn">TAP WHEN READY</button>
          </div>
        `);
        overlay.querySelector("#bombReady").onclick = () => {
          overlay.remove();
          this.runHolderTurn();
        };
      }

      randomLivingTarget() {
        const candidates = this.active
          .map((p, i) => ({ p, i }))
          .filter(item => item.p.alive && item.i !== this.holderIndex);
        return candidates[Math.floor(Math.random() * candidates.length)].i;
      }

      runHolderTurn() {
        this.running = true;
        this.targetIndex = this.randomLivingTarget();
        const r = this.rect();
        this.avatarPos = { x: r.width * .5, y: r.height * .72 };
        this.targetPos = {
          x: 55 + Math.random() * Math.max(1, r.width - 110),
          y: 70 + Math.random() * Math.max(1, r.height * .45)
        };

        this.playerEl = document.createElement("div");
        this.playerEl.className = "hot-player";
        this.playerEl.style.background = this.active[this.holderIndex].color;
        this.playerEl.innerHTML = `●<span class="bomb"></span>`;

        this.targetEl = document.createElement("div");
        this.targetEl.className = "hot-target";
        this.targetEl.style.background = this.active[this.targetIndex].color;
        this.targetEl.textContent = "→";

        this.area.append(this.playerEl, this.targetEl);
        this.updateHotPositions();

        this.dragging = false;
        this.listen(this.area, "pointerdown", event => {
          this.dragging = true;
          this.area.setPointerCapture?.(event.pointerId);
          this.dragHot(event);
        });
        this.listen(this.area, "pointermove", event => {
          if (this.dragging) this.dragHot(event);
        });
        this.listen(this.area, "pointerup", () => this.dragging = false);
        this.listen(this.area, "pointercancel", () => this.dragging = false);

        const tick = now => {
          if (!this.running) return;
          const left = Math.max(0, this.bombDuration - (now - this.bombStart));
          const holder = this.active[this.holderIndex];
          this.setHUD(`${holder.name} has bomb • ${(left / 1000).toFixed(1)}s`);
          if (left <= 0) {
            this.explode();
            return;
          }
          this.frame = requestAnimationFrame(tick);
        };
        this.frame = requestAnimationFrame(tick);
      }

      dragHot(event) {
        const p = this.pointFromEvent(event);
        const r = this.rect();
        this.avatarPos.x = Math.max(38, Math.min(r.width - 38, p.x));
        this.avatarPos.y = Math.max(38, Math.min(r.height - 38, p.y));
        this.updateHotPositions();

        if (Math.hypot(this.avatarPos.x - this.targetPos.x, this.avatarPos.y - this.targetPos.y) < 62) {
          this.passBomb();
        }
      }

      updateHotPositions() {
        this.playerEl.style.left = `${this.avatarPos.x}px`;
        this.playerEl.style.top = `${this.avatarPos.y}px`;
        this.targetEl.style.left = `${this.targetPos.x}px`;
        this.targetEl.style.top = `${this.targetPos.y}px`;
      }

      clearObjects() {
        this.playerEl?.remove();
        this.targetEl?.remove();
      }

      passBomb() {
        if (!this.running) return;
        this.running = false;
        if (this.frame) cancelAnimationFrame(this.frame);
        this.manager.sound("target");
        this.manager.vibrate(20);
        const next = this.active[this.targetIndex];
        this.clearObjects();
        this.ui.toast(`Bomb passed to ${next.name}!`);
        this.holderIndex = this.targetIndex;
        this.later(() => this.showPassOverlay(), 450);
      }

      explode() {
        if (!this.running) return;
        this.running = false;
        if (this.frame) cancelAnimationFrame(this.frame);
        const holder = this.active[this.holderIndex];
        holder.alive = false;
        this.clearObjects();
        this.area.classList.add("flash-red", "shake");
        this.manager.sound("hit");
        this.manager.vibrate([80, 30, 80]);
        this.ui.toast(`${holder.name} exploded!`);
        this.bombDuration = 15000 + Math.random() * 5000;
        this.holderIndex = this.randomNextLiving();
        this.later(() => this.beginBombRound(), 900);
      }

      randomNextLiving() {
        const living = this.active.map((p, i) => ({ p, i })).filter(item => item.p.alive);
        return living[Math.floor(Math.random() * living.length)].i;
      }

      finish() {
        const winner = this.active.find(p => p.alive);
        const rankings = [
          { name: winner.name, score: "Bomb survivor" },
          ...this.active.filter(p => !p.alive).reverse().map(p => ({ name: p.name, score: "Eliminated" }))
        ];
        this.manager.completeGame("hotCursor", rankings, "BOMB SURVIVOR", `${winner.name} kept cool under pressure.`);
      }
    }

    class ReflexShotGame extends BaseGame {
      start() {
        this.area = this.ui.gameShell("Reflex Shot", "Reflex Shot", "Preparing players…");
        this.results = [];
        this.playerIndex = 0;
        this.nextPlayer();
      }

      nextPlayer() {
        if (this.playerIndex >= this.players.length) {
          this.finish();
          return;
        }

        const player = this.players[this.playerIndex];
        const overlay = this.overlay(`
          <div class="overlay-card">
            <div class="hud-label">Reflex Shot</div>
            <h2>PASS TO ${player.toUpperCase()}</h2>
            <p>Wait for TAP! A touch during WAIT is a false start.</p>
            <button id="reflexReady" class="btn">TAP WHEN READY</button>
          </div>
        `);

        overlay.querySelector("#reflexReady").onclick = () => {
          overlay.remove();
          this.runAttempt();
        };
      }

      runAttempt() {
        const board = document.createElement("div");
        board.className = "reflex-board wait";
        board.innerHTML = `
          <div>
            <div class="reflex-big">WAIT…</div>
            <div class="reflex-sub">${this.players[this.playerIndex]}, stay ready.</div>
          </div>
        `;
        this.area.appendChild(board);
        this.state = "wait";
        this.setHUD(`${this.players[this.playerIndex]} • Wait for it…`);

        const falseStart = event => {
          event.preventDefault();
          if (this.state !== "wait") return;
          this.state = "done";
          board.innerHTML = `
            <div>
              <div class="reflex-big">TOO EARLY!</div>
              <div class="reflex-sub">False start: 9999 ms</div>
            </div>
          `;
          board.classList.remove("wait");
          board.style.background = "#c53d58";
          this.manager.sound("hit");
          this.manager.vibrate(45);
          this.results.push({ name: this.players[this.playerIndex], ms: 9999, falseStart: true });
          this.later(() => {
            board.remove();
            this.playerIndex++;
            this.nextPlayer();
          }, 1200);
        };

        board.addEventListener("pointerdown", falseStart);
        const delay = 1500 + Math.random() * 3500;

        this.later(() => {
          if (this.state !== "wait") return;
          this.state = "go";
          this.goAt = performance.now();
          board.className = "reflex-board go";
          board.innerHTML = `
            <div>
              <div class="reflex-big">TAP!</div>
              <div class="reflex-sub">NOW!</div>
            </div>
          `;
          this.manager.sound("start");

          const react = event => {
            event.preventDefault();
            if (this.state !== "go") return;
            this.state = "done";
            const ms = Math.round(performance.now() - this.goAt);
            this.storage.recordReaction(ms);
            this.results.push({ name: this.players[this.playerIndex], ms, falseStart: false });
            board.innerHTML = `
              <div>
                <div class="reflex-big">${ms} ms</div>
                <div class="reflex-sub">${ms < 250 ? "Lightning fast!" : ms < 400 ? "Nice reaction!" : "Keep practicing!"}</div>
              </div>
            `;
            this.manager.sound("win");
            this.manager.vibrate(22);
            this.later(() => {
              board.remove();
              this.playerIndex++;
              this.nextPlayer();
            }, 1200);
          };

          board.removeEventListener("pointerdown", falseStart);
          board.addEventListener("pointerdown", react, { once: true });
        }, delay);
      }

      finish() {
        const rankings = [...this.results]
          .sort((a, b) => a.ms - b.ms)
          .map(item => ({
            name: item.name,
            score: item.falseStart ? "False start" : `${item.ms} ms`
          }));

        const fastest = this.storage.data.stats.fastestReaction;
        const average = this.storage.averageReaction();

        this.manager.completeGame(
          "reflexShot",
          rankings,
          "REFLEX RESULTS",
          `Device best: ${fastest === null ? "—" : `${fastest} ms`} • Average: ${average === null ? "—" : `${average} ms`}`
        );
      }
    }

    class SurvivalWheelGame extends BaseGame {
      start() {
        this.area = this.ui.gameShell("Survival Wheel", "Survival Wheel", "Spin to choose");
        this.area.innerHTML = `
          <div class="wheel-wrap">
            <div class="wheel-box">
              <div class="wheel-pointer"></div>
              <canvas id="wheelCanvas"></canvas>
            </div>
            <button id="spinBtn" class="btn">SPIN</button>
            <p style="margin:0;color:var(--muted);font-size:.82rem;text-align:center">The chosen game will load next.</p>
          </div>
        `;
        this.canvas = this.area.querySelector("#wheelCanvas");
        this.ctx = this.canvas.getContext("2d");
        this.entries = ["dodgeStorm", "trailDuel", "targetRush", "hotCursor", "reflexShot"];
        this.rotation = 0;
        this.resize();
        this.listen(window, "resize", () => this.resize());
        this.area.querySelector("#spinBtn").addEventListener("click", () => this.spin());
      }

      resize() {
        const size = this.canvas.getBoundingClientRect().width;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.canvas.width = size * dpr;
        this.canvas.height = size * dpr;
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.size = size;
        this.drawWheel();
      }

      drawWheel() {
        const ctx = this.ctx;
        const size = this.size;
        if (!ctx || !size) return;
        const center = size / 2;
        const radius = center - 5;
        const slice = Math.PI * 2 / this.entries.length;
        ctx.clearRect(0, 0, size, size);

        this.entries.forEach((id, index) => {
          const start = this.rotation + index * slice - Math.PI / 2;
          const end = start + slice;
          const game = GAME_META[id];
          ctx.beginPath();
          ctx.moveTo(center, center);
          ctx.arc(center, center, radius, start, end);
          ctx.closePath();
          ctx.fillStyle = game.accent;
          ctx.fill();
          ctx.strokeStyle = "rgba(20,21,42,.45)";
          ctx.lineWidth = 3;
          ctx.stroke();

          const textAngle = start + slice / 2;
          ctx.save();
          ctx.translate(center, center);
          ctx.rotate(textAngle);
          ctx.textAlign = "right";
          ctx.fillStyle = "#1a1b31";
          ctx.font = `900 ${Math.max(12, size * .045)}px system-ui`;
          ctx.fillText(game.title.toUpperCase(), radius - 18, 5);
          ctx.restore();
        });

        ctx.beginPath();
        ctx.arc(center, center, size * .13, 0, Math.PI * 2);
        ctx.fillStyle = "#24274a";
        ctx.fill();
        ctx.strokeStyle = "#f4f5ff";
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = "#f4f5ff";
        ctx.font = `900 ${Math.max(13, size * .055)}px system-ui`;
        ctx.textAlign = "center";
        ctx.fillText("SPIN", center, center + 5);
      }

      spin() {
        if (this.spinning) return;
        this.spinning = true;
        const button = this.area.querySelector("#spinBtn");
        button.disabled = true;
        button.textContent = "SPINNING…";
        this.manager.sound("start");

        const start = performance.now();
        const duration = 3300;
        const startRotation = this.rotation;
        const extra = Math.PI * 2 * (6 + Math.floor(Math.random() * 4)) + Math.random() * Math.PI * 2;

        const animate = now => {
          const progress = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - progress, 4);
          this.rotation = startRotation + extra * eased;
          this.drawWheel();

          if (progress < 1) {
            this.frame = requestAnimationFrame(animate);
            return;
          }

          const selected = this.getSelection();
          this.manager.sound("win");
          this.setHUD(`Selected: ${GAME_META[selected].title}`);
          button.textContent = GAME_META[selected].title.toUpperCase();
          this.later(() => {
            this.manager.showSetup(selected);
          }, 900);
        };
        this.frame = requestAnimationFrame(animate);
      }

      getSelection() {
        const slice = Math.PI * 2 / this.entries.length;
        const normalized = ((-Math.PI / 2 - this.rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
        const index = Math.floor(normalized / slice) % this.entries.length;
        return this.entries[index];
      }
    }

    new GameManager();
  </script>
